[project]
name = "eire-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sriram Samala", email = "sriram.samala2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
]

[project.scripts]
eire-rag = "eire_rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
